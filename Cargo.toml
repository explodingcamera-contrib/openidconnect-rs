[package]
name = "openidconnect"
version = "4.1.0"
authors = ["David A. Ramos <ramos@cs.stanford.edu>"]
description = "OpenID Connect library"
keywords = ["openid", "oidc", "oauth2", "authentication", "auth"]
license = "MIT"
repository = "https://github.com/ramosbugs/openidconnect-rs"
edition = "2021"
readme = "README.md"
rust-version = "1.99"

[package.metadata.docs.rs]
all-features = true

[badges]
maintenance = { status = "actively-developed" }

[features]
accept-rfc3339-timestamps = []
accept-string-booleans = []
curl = ["oauth2/curl"]
default = ["reqwest", "rustls-tls"]
native-tls = ["oauth2/native-tls"]
reqwest = ["oauth2/reqwest"]
reqwest-blocking = ["oauth2/reqwest-blocking"]
rustls-tls = ["oauth2/rustls-tls"]
timing-resistant-secret-traits = ["oauth2/timing-resistant-secret-traits"]
ureq = ["oauth2/ureq"]

[[example]]
name = "gitlab"
required-features = ["reqwest-blocking"]

[[example]]
name = "google"
required-features = ["reqwest-blocking"]

[[example]]
name = "okta_device_grant"
required-features = ["reqwest-blocking"]

[dependencies]
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["now"] }
thiserror = "2.0"
http = "1.5"
itertools = "0.15"
oauth2 = { git = "https://github.com/explodingcamera-contrib/oauth2-rs", default-features = false }
rand = "0.10.4"
hmac = "0.13.0"
rsa = { version = "0.10.0", features = ["pkcs1v15"] }
sha2 = { version = "0.11.1", features = ["oid"] } # Object ID needed for pkcs1v15 padding
p256 = "0.14.0"
p384 = "0.14.0"
serde = "1.0"
serde_json = "1.0"
serde_path_to_error = "0.1"
url = { version = "2.5", features = ["serde"] }
ed25519-dalek = { version = "3.0.0", features = ["pem"] }

[dev-dependencies]
color-backtrace = { version = "0.7" }
env_logger = "0.11"
log = "0.4"
pretty_assertions = "1.4"
reqwest = { version = "0.13", features = ["blocking", "rustls"], default-features = false }
retry = "2.3"
anyhow = "1.0"
